#
# KoboToolbox behind Traefik, on a single host name. Adapted from the KPI
# server of kobotoolbox/kobo-docker nginx_site_default.conf.tmpl. All the
# containers share the pod network: services are reached on 127.0.0.1.
#
#   /          KPI (uWSGI on 127.0.0.1:8000), KoboCAT endpoints included
#   /static    static files, copied by KPI into the static-files volume
#   /enketo/   Enketo Express (127.0.0.1:8005, base path /enketo)
#

charset utf-8;

server {
    listen 8080 default_server;
    server_name _;

    # Allow 100M upload
    client_max_body_size 100M;
    # Support bigger headers. Useful for huge cookies
    large_client_header_buffers 8 16k;

    location /static {
        alias /srv/www/kpi;
    }

    # public media, e.g. custom logos (KPI `ConfigurationFile`s)
    location /media/__public {
        alias /srv/kpi_media/__public;
    }

    # media files served through X-Accel-Redirect
    location /protected/ {
        internal;
        alias /media/;
    }

    location /enketo/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        uwsgi_read_timeout 130;
        uwsgi_send_timeout 130;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_param HTTP_X_REAL_IP $remote_addr;
        include /etc/nginx/uwsgi_params;
        # Support longer query strings
        uwsgi_buffers 8 16k;
        uwsgi_buffer_size 16k;
        uwsgi_force_ranges on;
    }
}
